<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KarmaWorkspace — Share videos, notes & images</title>
<meta name="description" content="KarmaWorkspace — a creator platform where everyone can have a channel and share videos, notes and image posts. Like, comment and share.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ff5c39'/%3E%3Cpath d='M26 20l18 12-18 12z' fill='white'/%3E%3C/svg%3E">
<style>
/* ============ THEME ============ */
:root{
  --bg:#0f1115; --bg2:#171a21; --bg3:#1f2430; --card:#171a21;
  --text:#f1f3f6; --text2:#9aa3b2; --line:#262c38;
  --accent:#ff5c39; --accent2:#ff7d5c; --accent-text:#fff;
  --input-bg:#0b0d11; --shadow:0 6px 24px rgba(0,0,0,.45);
  --chip:#222834; --green:#31c48d;
}
html[data-theme="light"]{
  --bg:#f7f8fa; --bg2:#ffffff; --bg3:#eef0f4; --card:#ffffff;
  --text:#15191f; --text2:#5b6470; --line:#e3e6eb;
  --input-bg:#ffffff; --shadow:0 6px 24px rgba(20,30,50,.10);
  --chip:#eceff3;
}
@media (prefers-color-scheme: light){
  html:not([data-theme]){ --bg:#f7f8fa; --bg2:#ffffff; --bg3:#eef0f4; --card:#ffffff;
    --text:#15191f; --text2:#5b6470; --line:#e3e6eb; --input-bg:#ffffff;
    --shadow:0 6px 24px rgba(20,30,50,.10); --chip:#eceff3; }
}
*{box-sizing:border-box; margin:0; padding:0}
html,body{height:100%}
body{
  font-family:'Segoe UI',system-ui,-apple-system,Roboto,Ubuntu,sans-serif;
  background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased;
}
a{color:inherit; text-decoration:none}
img,video{max-width:100%; display:block}
button{font-family:inherit; cursor:pointer}
input,textarea,select{font-family:inherit}
::selection{background:var(--accent); color:#fff}

/* ============ LAYOUT ============ */
#topbar{
  position:sticky; top:0; z-index:50; display:flex; align-items:center; gap:14px;
  padding:10px 18px; background:var(--bg); border-bottom:1px solid var(--line);
}
.logo{display:flex; align-items:center; gap:9px; font-weight:800; font-size:19px; letter-spacing:.2px; white-space:nowrap}
.logo .mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#ff9d3d);display:grid;place-items:center;flex:0 0 auto}
.logo .mark svg{width:16px;height:16px}
.logo span em{color:var(--accent); font-style:normal}
#searchbar{flex:1; display:flex; max-width:560px; margin:0 auto; min-width:0}
#searchbar input{
  flex:1; background:var(--input-bg); border:1px solid var(--line); border-right:none;
  border-radius:22px 0 0 22px; padding:9px 16px; color:var(--text); font-size:14px; outline:none; min-width:0;
}
#searchbar input:focus{border-color:var(--accent)}
#searchbar button{
  border:1px solid var(--line); background:var(--chip); border-radius:0 22px 22px 0;
  padding:0 14px; color:var(--text2); display:grid; place-items:center;
}
#searchbar button:hover{color:var(--text)}
.top-actions{display:flex; align-items:center; gap:10px; margin-left:auto}
.icon-btn{
  background:none; border:none; color:var(--text2); width:38px; height:38px; border-radius:50%;
  display:grid; place-items:center;
}
.icon-btn:hover{background:var(--bg3); color:var(--text)}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  background:var(--accent); color:#fff; border:none; border-radius:22px;
  padding:9px 18px; font-size:14px; font-weight:600;
}
.btn:hover{background:var(--accent2)}
.btn.ghost{background:var(--bg3); color:var(--text)}
.btn.ghost:hover{background:var(--chip)}
.btn.sm{padding:6px 13px; font-size:13px}
.btn[disabled]{opacity:.55; cursor:default}
.avatar{
  border-radius:50%; object-fit:cover; background:linear-gradient(135deg,var(--accent),#ffb03a);
  color:#fff; display:grid; place-items:center; font-weight:700; flex:0 0 auto; overflow:hidden;
}
#shell{display:flex; min-height:calc(100vh - 59px)}
#sidebar{
  width:216px; flex:0 0 auto; padding:14px 10px; border-right:1px solid var(--line);
  display:flex; flex-direction:column; gap:4px; position:sticky; top:59px; height:calc(100vh - 59px); overflow-y:auto;
}
.side-link{
  display:flex; align-items:center; gap:14px; padding:10px 14px; border-radius:10px;
  color:var(--text2); font-size:14.5px; font-weight:500; cursor:pointer;
}
.side-link:hover{background:var(--bg3); color:var(--text)}
.side-link.active{background:var(--bg3); color:var(--text); font-weight:700}
.side-link svg{width:20px;height:20px; flex:0 0 auto}
#main{flex:1; min-width:0; padding:22px 26px 90px}
#bottomnav{
  display:none; position:fixed; bottom:0; left:0; right:0; z-index:50;
  background:var(--bg); border-top:1px solid var(--line);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
#bottomnav .bwrap{display:flex}
#bottomnav .bn{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
  color:var(--text2); font-size:10.5px; padding:4px 0; border-radius:8px;
}
#bottomnav .bn svg{width:21px;height:21px}
#bottomnav .bn.active{color:var(--accent)}
@media(max-width:860px){
  #sidebar{display:none}
  #main{padding:16px 12px 96px}
  #bottomnav{display:block}
  .hide-mobile{display:none !important}
}

/* ============ FEED ============ */
.page-title{font-size:21px; font-weight:800; margin-bottom:16px; display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.feed{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:20px;
}
.card{cursor:pointer; display:flex; flex-direction:column; gap:9px}
.thumb{
  border-radius:14px; overflow:hidden; aspect-ratio:16/9; background:var(--bg3);
  position:relative; display:grid; place-items:center;
}
.thumb img,.thumb video{width:100%; height:100%; object-fit:cover}
.thumb .note-cover{
  position:absolute; inset:0; background:linear-gradient(135deg,#2b1a4d,#7a1f3d 60%,#b3411f);
  display:flex; align-items:flex-end; padding:14px; color:#fff; font-weight:600; font-size:14px;
}
.badge{
  position:absolute; right:8px; bottom:8px; background:rgba(0,0,0,.78); color:#fff;
  font-size:11.5px; font-weight:600; border-radius:6px; padding:2px 7px; display:flex; align-items:center; gap:5px;
}
.badge svg{width:12px;height:12px}
.card-meta{display:flex; gap:10px; align-items:flex-start}
.card-meta .avatar{width:36px;height:36px;font-size:15px}
.card-title{font-size:14.5px; font-weight:600; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.card-sub{font-size:13px; color:var(--text2); margin-top:3px; line-height:1.5}
.card-sub .dot{margin:0 5px}
.type-chip{
  display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700;
  background:var(--chip); border-radius:5px; padding:2px 7px; text-transform:uppercase; letter-spacing:.4px;
}
.empty{
  text-align:center; color:var(--text2); padding:70px 20px; font-size:15px;
}
.empty .big{font-size:44px; margin-bottom:12px}

/* ============ POST PAGE ============ */
.post-wrap{max-width:920px; margin:0 auto}
.player{border-radius:16px; overflow:hidden; background:#000; aspect-ratio:16/9}
.player video{width:100%; height:100%}
.player img{width:100%; aspect-ratio:16/9; object-fit:contain; background:#000}
.note-card{
  border-radius:16px; background:var(--bg2); border:1px solid var(--line); padding:26px 28px;
}
.note-card h1{font-size:20px; margin-bottom:14px}
.note-body{white-space:pre-wrap; font-size:15.5px; line-height:1.75; color:var(--text)}
.post-title{font-size:19px; font-weight:800; margin:16px 0 4px}
.post-stats{color:var(--text2); font-size:13.5px; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.actionbar{
  display:flex; align-items:center; gap:8px; margin:14px 0 4px; padding:10px 0;
  border-bottom:1px solid var(--line); flex-wrap:wrap;
}
.act{
  display:inline-flex; align-items:center; gap:7px; border:none; background:var(--bg3);
  color:var(--text); border-radius:18px; padding:8px 15px; font-size:13.5px; font-weight:600;
}
.act:hover{background:var(--chip)}
.act.liked{background:var(--accent); color:#fff}
.act svg{width:17px;height:17px}
.comments{margin-top:22px}
.comments h3{font-size:16px; margin-bottom:14px}
.cbox{display:flex; gap:12px; margin-bottom:18px}
.cbox .avatar{width:38px;height:38px;font-size:15px}
.cinput{flex:1}
.cinput textarea{
  width:100%; background:var(--input-bg); border:1px solid var(--line); border-radius:10px;
  padding:10px 13px; color:var(--text); font-size:14px; resize:vertical; min-height:44px; outline:none;
}
.cinput textarea:focus{border-color:var(--accent)}
.comment{display:flex; gap:12px; margin-bottom:18px}
.comment .avatar{width:38px;height:38px;font-size:15px}
.comment .cbody{background:var(--bg2); border:1px solid var(--line); border-radius:4px 14px 14px 14px; padding:10px 14px; flex:1}
.comment .chead{font-size:13px; color:var(--text2); margin-bottom:4px}
.comment .chead b{color:var(--text); cursor:pointer}
.comment .ctext{font-size:14.5px; line-height:1.55; white-space:pre-wrap; word-break:break-word}

/* ============ CHANNEL ============ */
.channel-head{max-width:980px; margin:0 auto 22px}
.banner{border-radius:18px; height:170px; background:linear-gradient(120deg,#3b1d5e,#8e2440 55%,#c2521d); position:relative; overflow:hidden}
.banner img{width:100%;height:100%;object-fit:cover}
.ch-row{display:flex; gap:20px; margin-top:-44px; padding:0 24px; align-items:flex-end; flex-wrap:wrap}
.ch-row .avatar{width:96px;height:96px;font-size:34px;border:4px solid var(--bg); box-shadow:var(--shadow)}
.ch-info h1{font-size:23px}
.ch-info .hnd{color:var(--text2); font-size:14px; margin-top:3px}
.ch-info .bio{font-size:14px; color:var(--text2); margin-top:8px; max-width:640px}
.ch-btns{margin-left:auto; display:flex; gap:10px; padding-bottom:8px}

/* ============ FORMS / UPLOAD ============ */
.form-card{max-width:440px; margin:36px auto; background:var(--bg2); border:1px solid var(--line); border-radius:18px; padding:30px 28px; box-shadow:var(--shadow)}
.form-card h1{font-size:22px; margin-bottom:6px}
.form-card .sub{color:var(--text2); font-size:13.5px; margin-bottom:20px}
.field{margin-bottom:15px}
.field label{display:block; font-size:13px; font-weight:600; color:var(--text2); margin-bottom:6px}
.field input,.field textarea,.field select{
  width:100%; background:var(--input-bg); border:1px solid var(--line); border-radius:10px;
  padding:11px 13px; color:var(--text); font-size:14.5px; outline:none;
}
.field textarea{min-height:110px; resize:vertical; line-height:1.55}
.field input:focus,.field textarea:focus{border-color:var(--accent)}
.form-msg{font-size:13.5px; margin-top:12px; min-height:18px}
.form-msg.err{color:#ff7676} .form-msg.ok{color:var(--green)}
.tabs{display:flex; gap:8px; margin-bottom:22px; flex-wrap:wrap}
.tab{
  border:1px solid var(--line); background:var(--bg2); color:var(--text2); border-radius:20px;
  padding:8px 18px; font-size:13.5px; font-weight:600; display:inline-flex; gap:7px; align-items:center;
}
.tab.active{background:var(--accent); border-color:var(--accent); color:#fff}
.tab svg{width:15px;height:15px}
.dropzone{
  border:2px dashed var(--line); border-radius:14px; padding:34px 20px; text-align:center;
  color:var(--text2); cursor:pointer; transition:.15s;
}
.dropzone:hover,.dropzone.over{border-color:var(--accent); color:var(--text)}
.dropzone .big{font-size:32px; margin-bottom:8px}
.dropzone video,.dropzone img{max-height:200px; margin:0 auto 10px; border-radius:10px}
.progress{height:8px; background:var(--bg3); border-radius:6px; overflow:hidden; margin:14px 0}
.progress > div{height:100%; width:0%; background:linear-gradient(90deg,var(--accent),#ffb03a); transition:width .2s}

/* ============ MISC ============ */
.toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%); z-index:100;
  background:var(--text); color:var(--bg); padding:11px 20px; border-radius:24px;
  font-size:14px; font-weight:600; box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:.25s;
  max-width:88vw; text-align:center;
}
.toast.show{opacity:1; bottom:34px}
.menu{
  position:absolute; right:12px; top:56px; background:var(--bg2); border:1px solid var(--line);
  border-radius:14px; box-shadow:var(--shadow); padding:7px; min-width:180px; display:none; z-index:60;
}
.menu.open{display:block}
.menu a,.menu button.mitem{
  display:flex; align-items:center; gap:11px; width:100%; padding:9px 12px; border-radius:9px;
  color:var(--text); font-size:14px; background:none; border:none; text-align:left;
}
.menu a:hover,.menu button.mitem:hover{background:var(--bg3)}
.menu svg{width:17px;height:17px;color:var(--text2)}
.setup-screen{
  max-width:620px; margin:60px auto; text-align:center; padding:20px;
}
.setup-screen h1{font-size:26px; margin-bottom:12px}
.setup-screen p{color:var(--text2); line-height:1.7; font-size:15px}
.skeleton{background:linear-gradient(90deg,var(--bg3),var(--chip),var(--bg3)); background-size:200% 100%; animation:sk 1.2s infinite; border-radius:14px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.search-tabs{display:flex; gap:8px; margin-bottom:18px}
.result-ch{display:flex; gap:14px; align-items:center; padding:12px; border-radius:14px; cursor:pointer}
.result-ch:hover{background:var(--bg2)}
.result-ch .avatar{width:56px;height:56px;font-size:22px}
</style>
</head>
<body>

<header id="topbar">
  <a href="#/" class="logo" title="KarmaWorkspace">
    <span class="mark"><svg viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg></span>
    <span>Karma<em>Workspace</em></span>
  </a>
  <form id="searchbar" autocomplete="off">
    <input id="q" type="search" placeholder="Search videos, notes, images, channels…" aria-label="Search">
    <button type="submit" aria-label="Search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="17" height="17"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    </button>
  </form>
