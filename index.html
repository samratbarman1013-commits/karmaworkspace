<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KarmaWorkspace — Share videos, notes & images</title>
<meta name="description" content="KarmaWorkspace — a creator platform where everyone can have a channel and share videos, notes and image posts. Like, comment and share.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ff5c39'/%3E%3Cpath d='M26 20l18 12-18 12z' fill='white'/%3E%3C/svg%3E">
<style>
/* ============ THEME ============ */
:root{
  --bg:#0f1115; --bg2:#171a21; --bg3:#1f2430; --card:#171a21;
  --text:#f1f3f6; --text2:#9aa3b2; --line:#262c38;
  --accent:#ff5c39; --accent2:#ff7d5c; --accent-text:#fff;
  --input-bg:#0b0d11; --shadow:0 6px 24px rgba(0,0,0,.45);
  --chip:#222834; --green:#31c48d;
}
html[data-theme="light"]{
  --bg:#f7f8fa; --bg2:#ffffff; --bg3:#eef0f4; --card:#ffffff;
  --text:#15191f; --text2:#5b6470; --line:#e3e6eb;
  --input-bg:#ffffff; --shadow:0 6px 24px rgba(20,30,50,.10);
  --chip:#eceff3;
}
@media (prefers-color-scheme: light){
  html:not([data-theme]){ --bg:#f7f8fa; --bg2:#ffffff; --bg3:#eef0f4; --card:#ffffff;
    --text:#15191f; --text2:#5b6470; --line:#e3e6eb; --input-bg:#ffffff;
    --shadow:0 6px 24px rgba(20,30,50,.10); --chip:#eceff3; }
}
*{box-sizing:border-box; margin:0; padding:0}
html,body{height:100%}
body{
  font-family:'Segoe UI',system-ui,-apple-system,Roboto,Ubuntu,sans-serif;
  background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased;
}
a{color:inherit; text-decoration:none}
img,video{max-width:100%; display:block}
button{font-family:inherit; cursor:pointer}
input,textarea,select{font-family:inherit}
::selection{background:var(--accent); color:#fff}

/* ============ LAYOUT ============ */
#topbar{
  position:sticky; top:0; z-index:50; display:flex; align-items:center; gap:14px;
  padding:10px 18px; background:var(--bg); border-bottom:1px solid var(--line);
}
.logo{display:flex; align-items:center; gap:9px; font-weight:800; font-size:19px; letter-spacing:.2px; white-space:nowrap}
.logo .mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#ff9d3d);display:grid;place-items:center;flex:0 0 auto}
.logo .mark svg{width:16px;height:16px}
.logo span em{color:var(--accent); font-style:normal}
#searchbar{flex:1; display:flex; max-width:560px; margin:0 auto; min-width:0}
#searchbar input{
  flex:1; background:var(--input-bg); border:1px solid var(--line); border-right:none;
  border-radius:22px 0 0 22px; padding:9px 16px; color:var(--text); font-size:14px; outline:none; min-width:0;
}
#searchbar input:focus{border-color:var(--accent)}
#searchbar button{
  border:1px solid var(--line); background:var(--chip); border-radius:0 22px 22px 0;
  padding:0 14px; color:var(--text2); display:grid; place-items:center;
}
#searchbar button:hover{color:var(--text)}
.top-actions{display:flex; align-items:center; gap:10px; margin-left:auto}
.icon-btn{
  background:none; border:none; color:var(--text2); width:38px; height:38px; border-radius:50%;
  display:grid; place-items:center;
}
.icon-btn:hover{background:var(--bg3); color:var(--text)}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  background:var(--accent); color:#fff; border:none; border-radius:22px;
  padding:9px 18px; font-size:14px; font-weight:600;
}
.btn:hover{background:var(--accent2)}
.btn.ghost{background:var(--bg3); color:var(--text)}
.btn.ghost:hover{background:var(--chip)}
.btn.sm{padding:6px 13px; font-size:13px}
.btn[disabled]{opacity:.55; cursor:default}
.avatar{
  border-radius:50%; object-fit:cover; background:linear-gradient(135deg,var(--accent),#ffb03a);
  color:#fff; display:grid; place-items:center; font-weight:700; flex:0 0 auto; overflow:hidden;
}
#shell{display:flex; min-height:calc(100vh - 59px)}
#sidebar{
  width:216px; flex:0 0 auto; padding:14px 10px; border-right:1px solid var(--line);
  display:flex; flex-direction:column; gap:4px; position:sticky; top:59px; height:calc(100vh - 59px); overflow-y:auto;
}
.side-link{
  display:flex; align-items:center; gap:14px; padding:10px 14px; border-radius:10px;
  color:var(--text2); font-size:14.5px; font-weight:500; cursor:pointer;
}
.side-link:hover{background:var(--bg3); color:var(--text)}
.side-link.active{background:var(--bg3); color:var(--text); font-weight:700}
.side-link svg{width:20px;height:20px; flex:0 0 auto}
#main{flex:1; min-width:0; padding:22px 26px 90px}
#bottomnav{
  display:none; position:fixed; bottom:0; left:0; right:0; z-index:50;
  background:var(--bg); border-top:1px solid var(--line);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
#bottomnav .bwrap{display:flex}
#bottomnav .bn{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
  color:var(--text2); font-size:10.5px; padding:4px 0; border-radius:8px;
}
#bottomnav .bn svg{width:21px;height:21px}
#bottomnav .bn.active{color:var(--accent)}
@media(max-width:860px){
  #sidebar{display:none}
  #main{padding:16px 12px 96px}
  #bottomnav{display:block}
  .hide-mobile{display:none !important}
}

/* ============ FEED ============ */
.page-title{font-size:21px; font-weight:800; margin-bottom:16px; display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.feed{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:20px;
}
.card{cursor:pointer; display:flex; flex-direction:column; gap:9px}
.thumb{
  border-radius:14px; overflow:hidden; aspect-ratio:16/9; background:var(--bg3);
  position:relative; display:grid; place-items:center;
}
.thumb img,.thumb video{width:100%; height:100%; object-fit:cover}
.thumb .note-cover{
  position:absolute; inset:0; background:linear-gradient(135deg,#2b1a4d,#7a1f3d 60%,#b3411f);
  display:flex; align-items:flex-end; padding:14px; color:#fff; font-weight:600; font-size:14px;
}
.badge{
  position:absolute; right:8px; bottom:8px; background:rgba(0,0,0,.78); color:#fff;
  font-size:11.5px; font-weight:600; border-radius:6px; padding:2px 7px; display:flex; align-items:center; gap:5px;
}
.badge svg{width:12px;height:12px}
.card-meta{display:flex; gap:10px; align-items:flex-start}
.card-meta .avatar{width:36px;height:36px;font-size:15px}
.card-title{font-size:14.5px; font-weight:600; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.card-sub{font-size:13px; color:var(--text2); margin-top:3px; line-height:1.5}
.card-sub .dot{margin:0 5px}
.type-chip{
  display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700;
  background:var(--chip); border-radius:5px; padding:2px 7px; text-transform:uppercase; letter-spacing:.4px;
}
.empty{
  text-align:center; color:var(--text2); padding:70px 20px; font-size:15px;
}
.empty .big{font-size:44px; margin-bottom:12px}

/* ============ POST PAGE ============ */
.post-wrap{max-width:920px; margin:0 auto}
.player{border-radius:16px; overflow:hidden; background:#000; aspect-ratio:16/9}
.player video{width:100%; height:100%}
.player img{width:100%; aspect-ratio:16/9; object-fit:contain; background:#000}
.note-card{
  border-radius:16px; background:var(--bg2); border:1px solid var(--line); padding:26px 28px;
}
.note-card h1{font-size:20px; margin-bottom:14px}
.note-body{white-space:pre-wrap; font-size:15.5px; line-height:1.75; color:var(--text)}
.post-title{font-size:19px; font-weight:800; margin:16px 0 4px}
.post-stats{color:var(--text2); font-size:13.5px; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.actionbar{
  display:flex; align-items:center; gap:8px; margin:14px 0 4px; padding:10px 0;
  border-bottom:1px solid var(--line); flex-wrap:wrap;
}
.act{
  display:inline-flex; align-items:center; gap:7px; border:none; background:var(--bg3);
  color:var(--text); border-radius:18px; padding:8px 15px; font-size:13.5px; font-weight:600;
}
.act:hover{background:var(--chip)}
.act.liked{background:var(--accent); color:#fff}
.act svg{width:17px;height:17px}
.comments{margin-top:22px}
.comments h3{font-size:16px; margin-bottom:14px}
.cbox{display:flex; gap:12px; margin-bottom:18px}
.cbox .avatar{width:38px;height:38px;font-size:15px}
.cinput{flex:1}
.cinput textarea{
  width:100%; background:var(--input-bg); border:1px solid var(--line); border-radius:10px;
  padding:10px 13px; color:var(--text); font-size:14px; resize:vertical; min-height:44px; outline:none;
}
.cinput textarea:focus{border-color:var(--accent)}
.comment{display:flex; gap:12px; margin-bottom:18px}
.comment .avatar{width:38px;height:38px;font-size:15px}
.comment .cbody{background:var(--bg2); border:1px solid var(--line); border-radius:4px 14px 14px 14px; padding:10px 14px; flex:1}
.comment .chead{font-size:13px; color:var(--text2); margin-bottom:4px}
.comment .chead b{color:var(--text); cursor:pointer}
.comment .ctext{font-size:14.5px; line-height:1.55; white-space:pre-wrap; word-break:break-word}

/* ============ CHANNEL ============ */
.channel-head{max-width:980px; margin:0 auto 22px}
.banner{border-radius:18px; height:170px; background:linear-gradient(120deg,#3b1d5e,#8e2440 55%,#c2521d); position:relative; overflow:hidden}
.banner img{width:100%;height:100%;object-fit:cover}
.ch-row{display:flex; gap:20px; margin-top:-44px; padding:0 24px; align-items:flex-end; flex-wrap:wrap}
.ch-row .avatar{width:96px;height:96px;font-size:34px;border:4px solid var(--bg); box-shadow:var(--shadow)}
.ch-info h1{font-size:23px}
.ch-info .hnd{color:var(--text2); font-size:14px; margin-top:3px}
.ch-info .bio{font-size:14px; color:var(--text2); margin-top:8px; max-width:640px}
.ch-btns{margin-left:auto; display:flex; gap:10px; padding-bottom:8px}

/* ============ FORMS / UPLOAD ============ */
.form-card{max-width:440px; margin:36px auto; background:var(--bg2); border:1px solid var(--line); border-radius:18px; padding:30px 28px; box-shadow:var(--shadow)}
.form-card h1{font-size:22px; margin-bottom:6px}
.form-card .sub{color:var(--text2); font-size:13.5px; margin-bottom:20px}
.field{margin-bottom:15px}
.field label{display:block; font-size:13px; font-weight:600; color:var(--text2); margin-bottom:6px}
.field input,.field textarea,.field select{
  width:100%; background:var(--input-bg); border:1px solid var(--line); border-radius:10px;
  padding:11px 13px; color:var(--text); font-size:14.5px; outline:none;
}
.field textarea{min-height:110px; resize:vertical; line-height:1.55}
.field input:focus,.field textarea:focus{border-color:var(--accent)}
.form-msg{font-size:13.5px; margin-top:12px; min-height:18px}
.form-msg.err{color:#ff7676} .form-msg.ok{color:var(--green)}
.tabs{display:flex; gap:8px; margin-bottom:22px; flex-wrap:wrap}
.tab{
  border:1px solid var(--line); background:var(--bg2); color:var(--text2); border-radius:20px;
  padding:8px 18px; font-size:13.5px; font-weight:600; display:inline-flex; gap:7px; align-items:center;
}
.tab.active{background:var(--accent); border-color:var(--accent); color:#fff}
.tab svg{width:15px;height:15px}
.dropzone{
  border:2px dashed var(--line); border-radius:14px; padding:34px 20px; text-align:center;
  color:var(--text2); cursor:pointer; transition:.15s;
}
.dropzone:hover,.dropzone.over{border-color:var(--accent); color:var(--text)}
.dropzone .big{font-size:32px; margin-bottom:8px}
.dropzone video,.dropzone img{max-height:200px; margin:0 auto 10px; border-radius:10px}
.progress{height:8px; background:var(--bg3); border-radius:6px; overflow:hidden; margin:14px 0}
.progress > div{height:100%; width:0%; background:linear-gradient(90deg,var(--accent),#ffb03a); transition:width .2s}

/* ============ MISC ============ */
.toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%); z-index:100;
  background:var(--text); color:var(--bg); padding:11px 20px; border-radius:24px;
  font-size:14px; font-weight:600; box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:.25s;
  max-width:88vw; text-align:center;
}
.toast.show{opacity:1; bottom:34px}
.menu{
  position:absolute; right:12px; top:56px; background:var(--bg2); border:1px solid var(--line);
  border-radius:14px; box-shadow:var(--shadow); padding:7px; min-width:180px; display:none; z-index:60;
}
.menu.open{display:block}
.menu a,.menu button.mitem{
  display:flex; align-items:center; gap:11px; width:100%; padding:9px 12px; border-radius:9px;
  color:var(--text); font-size:14px; background:none; border:none; text-align:left;
}
.menu a:hover,.menu button.mitem:hover{background:var(--bg3)}
.menu svg{width:17px;height:17px;color:var(--text2)}
.setup-screen{
  max-width:620px; margin:60px auto; text-align:center; padding:20px;
}
.setup-screen h1{font-size:26px; margin-bottom:12px}
.setup-screen p{color:var(--text2); line-height:1.7; font-size:15px}
.skeleton{background:linear-gradient(90deg,var(--bg3),var(--chip),var(--bg3)); background-size:200% 100%; animation:sk 1.2s infinite; border-radius:14px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.search-tabs{display:flex; gap:8px; margin-bottom:18px}
.result-ch{display:flex; gap:14px; align-items:center; padding:12px; border-radius:14px; cursor:pointer}
.result-ch:hover{background:var(--bg2)}
.result-ch .avatar{width:56px;height:56px;font-size:22px}
</style>
</head>
<body>

<header id="topbar">
  <a href="#/" class="logo" title="KarmaWorkspace">
    <span class="mark"><svg viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg></span>
    <span>Karma<em>Workspace</em></span>
  </a>
  <form id="searchbar" autocomplete="off">
    <input id="q" type="search" placeholder="Search videos, notes, images, channels…" aria-label="Search">
    <button type="submit" aria-label="Search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="17" height="17"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    </button>
  </form>
  <div class="top-actions">
    <button class="icon-btn" id="themeBtn" title="Switch theme"></button>
    <a class="btn hide-mobile" href="#/upload" id="uploadBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M12 16V4m0 0l-4 4m4-4l4 4"/><path d="M4 20h16"/></svg>
      Create
    </a>
    <div style="position:relative" id="userMenuWrap"></div>
  </div>
</header>

<div id="shell">
  <nav id="sidebar"></nav>
  <main id="main"><div class="empty">Loading…</div></main>
</div>

<nav id="bottomnav"><div class="bwrap" id="bnav"></div></nav>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
/* ================= CONFIG ================= */
const SUPABASE_URL  = "PASTE_YOUR_SUPABASE_URL";
const SUPABASE_ANON_KEY = "PASTE_YOUR_SUPABASE_ANON_KEY";

const CONFIGURED = !SUPABASE_URL.includes("PASTE_") && !SUPABASE_ANON_KEY.includes("PASTE_");

/* ================= STATE / INIT ================= */
let sb = null;
let me = null;         // auth user
let myProfile = null; // my profile row
const profileCache = {};

if (!CONFIGURED) {
  document.getElementById('main').innerHTML = `
    <div class="setup-screen">
      <div style="font-size:52px;margin-bottom:10px">🛠️</div>
      <h1>Almost there!</h1>
      <p>KarmaWorkspace is deployed, but it isn't connected to its database yet.<br><br>
      The site owner needs to paste the <b>Supabase project URL</b> and <b>anon key</b> into the site configuration and redeploy. Refresh once that's done.</p>
    </div>`;
} else {
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  boot();
}

async function boot(){
  applyTheme();
  renderThemeBtn();
  bindSearch();
  const { data:{ user } } = await sb.auth.getUser();
  me = user;
  if (me) await loadMyProfile();
  renderSidebar(); renderUserMenu(); renderBottomNav();
  sb.auth.onAuthStateChange(async (evt, session)=>{
    me = session?.user ?? null;
    if (me) await loadMyProfile(); else myProfile = null;
    renderSidebar(); renderUserMenu(); renderBottomNav(); route();
  });
  window.addEventListener('hashchange', route);
  route();
}

async function loadMyProfile(){
  const { data } = await sb.from('profiles').select('*').eq('id', me.id).maybeSingle();
  myProfile = data;
}

/* ================= HELPERS ================= */
const $ = s => document.querySelector(s);
const main = () => document.getElementById('main');
function esc(s){ return String(s??'').replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';'); }
function timeAgo(iso){
  const s = Math.floor((Date.now() - new Date(iso).getTime())/1000);
  if (s < 60) return 'just now';
  const m = Math.floor(s/60); if (m < 60) return m + 'm ago';
  const h = Math.floor(m/60); if (h < 24) return h + 'h ago';
  const d = Math.floor(h/24); if (d < 30) return d + 'd ago';
  const mo = Math.floor(d/30); if (mo < 12) return mo + 'mo ago';
  return Math.floor(mo/12) + 'y ago';
}
function fmtNum(n){ n = n||0; if (n >= 1e6) return (n/1e6).toFixed(1).replace('.0','') + 'M'; if (n >= 1e3) return (n/1e3).toFixed(1).replace('.0','') + 'K'; return String(n); }
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 2400);
}
const ICONS = {
  heart:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.7-10-9.3C.6 8.6 2.6 5 6.2 5c2 0 3.4 1.1 4.2 2.4L12 9l1.6-1.6C14.4 6.1 15.8 5 17.8 5c3.6 0 5.6 3.6 4.2 6.7C19.5 16.3 12 21 12 21z"/></svg>',
  heartO:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7.5-4.7-10-9.3C.6 8.6 2.6 5 6.2 5c2 0 3.4 1.1 4.2 2.4L12 9l1.6-1.6C14.4 6.1 15.8 5 17.8 5c3.6 0 5.6 3.6 4.2 6.7C19.5 16.3 12 21 12 21z"/></svg>',
  comment:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
  share:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>',
  video:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 16.5l6-4.5-6-4.5z"/><path d="M4 4h16v16H4z" fill="none" stroke="currentColor" stroke-width="2"/></svg>',
  image:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>',
  note:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h4"/></svg>',
};
function avatarHTML(p, size){
  const s = size || 36, fs = Math.round(s*0.4);
  if (p?.avatar_url) return `<img class="avatar" src="${esc(p.avatar_url)}" width="${s}" height="${s}" alt="" style="width:${s}px;height:${s}px">`;
  const letter = esc((p?.name || '?').trim().charAt(0).toUpperCase());
  return `<div class="avatar" style="width:${s}px;height:${s}px;font-size:${fs}px">${letter}</div>`;
}
async function getProfile(id){
  if (profileCache[id]) return profileCache[id];
  const { data } = await sb.from('profiles').select('id,handle,name,avatar_url').eq('id', id).maybeSingle();
  profileCache[id] = data || { id, name:'Unknown', handle:'unknown' };
  return profileCache[id];
}

/* ================= THEME ================= */
function applyTheme(){
  const pref = localStorage.getItem('kw-theme'); // 'light' | 'dark' | null(follow device)
  if (pref) document.documentElement.setAttribute('data-theme', pref);
  else document.documentElement.removeAttribute('data-theme');
}
function renderThemeBtn(){
  const btn = $('#themeBtn');
  const current = document.documentElement.getAttribute('data-theme') ||
    (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  btn.innerHTML = current === 'light'

/* ================= ROUTER ================= */
async function route(){
  renderSidebar(); renderBottomNav(); renderUserMenu();
  window.scrollTo(0,0);
  const h = currentHash();
  const [path, qs] = h.slice(1).split('?');
  const params = new URLSearchParams(qs || '');
  const seg = path.split('/').filter(Boolean);

  if (!seg.length) return viewHome();
  switch(seg[0]){
    case 'post': return viewPost(params.get('id'));
    case 'channel': return viewChannel(params.get('id'));
    case 'mychannel': return me ? viewChannel(me.id) : viewAuth();
    case 'upload': return me ? viewUpload() : viewAuth();
    case 'settings': return me ? viewSettings() : viewAuth();
    case 'auth': return viewAuth();
    case 'search': return viewSearch(params.get('q') || '');
    default: return viewHome();
  }
}

/* ================= DATA QUERIES ================= */
const POST_SELECT = `id,owner,type,title,description,content,media_url,thumb_url,created_at,
  profiles!posts_owner_fkey(id,handle,name,avatar_url),
  likes(count), comments(count)`;

async function fetchPosts({ ownerId=null, search=null, limit=60 } = {}){
  let q = sb.from('posts').select(POST_SELECT).order('created_at', { ascending:false }).limit(limit);
  if (ownerId) q = q.eq('owner', ownerId);
  if (search) q = q.or(`title.ilike.%${search}%,description.ilike.%${search}%`);
  const { data, error } = await q;
  if (error) throw error;
  return data.map(p => ({ ...p, like_count: p.likes?.[0]?.count || 0, comment_count: p.comments?.[0]?.count || 0 }));
}
async function fetchMyLikes(postIds){
  if (!me || !postIds.length) return new Set();
  const { data } = await sb.from('likes').select('post_id').in('post_id', postIds).eq('user_id', me.id);
  return new Set((data||[]).map(l => l.post_id));
}

/* ================= VIEWS ================= */
function skeletonFeed(n=8){
  return `<div class="feed">${Array(n).fill(`<div><div class="skeleton" style="aspect-ratio:16/9"></div><div style="display:flex;gap:10px;margin-top:10px"><div class="skeleton" style="width:36px;height:36px;border-radius:50%"></div><div style="flex:1"><div class="skeleton" style="height:14px;margin-bottom:7px"></div><div class="skeleton" style="height:12px;width:65%"></div></div></div></div>`).join('')}</div>`;
}

async function viewHome(){
  main().innerHTML = `<div class="page-title">Latest on KarmaWorkspace</div>` + skeletonFeed();
  try{
    const posts = await fetchPosts();
    const liked = await fetchMyLikes(posts.map(p=>p.id));
    main().innerHTML = `<div class="page-title">Latest on KarmaWorkspace</div>` + (posts.length ? `<div class="feed">${posts.map(p=>cardHTML(p, liked.has(p.id))).join('')}</div>` : emptyState('Feed is empty', 'Be the first to share something!'));
  }catch(e){ main().innerHTML = errorState(e); }
}

function emptyState(title, sub){
  return `<div class="empty"><div class="big">🌱</div><b>${esc(title)}</b><br>${esc(sub)}
    ${me ? `<p style="margin-top:16px"><a class="btn" href="#/upload">Create a post</a></p>` : `<p style="margin-top:16px"><a class="btn" href="#/auth">Sign in to post</a></p>`}</div>`;
}
function errorState(e){
  return `<div class="empty"><div class="big">⚠️</div><b>Something went wrong</b><br>${esc(e?.message || 'Unknown error')}</div>`;
}

function cardHTML(p, isLiked){
  let thumb;
  if (p.type === 'video'){
    thumb = (p.thumb_url
      ? `<img src="${esc(p.thumb_url)}" alt="" loading="lazy">`
      : `<video src="${esc(p.media_url)}" preload="metadata" muted playsinline style="width:100%;height:100%;object-fit:cover"></video>`)
      + `<span class="badge">${ICONS.video} Video</span>`;
  } else if (p.type === 'image'){
    thumb = `<img src="${esc(p.media_url)}" alt="" loading="lazy"><span class="badge">${ICONS.image} Image</span>`;
  } else {
    thumb = `<div class="note-cover"><span>${esc((p.content||p.description||'').slice(0,140))}</span></div><span class="badge">${ICONS.note} Note</span>`;
  }
  return `
  <div class="card" onclick="location.hash='#/post?id=${p.id}'">
    <div class="thumb">${thumb}</div>
    <div class="card-meta">
      ${avatarHTML(p.profiles, 36)}
      <div style="min-width:0">
        <div class="card-title">${esc(p.title)}</div>
        <div class="card-sub">${esc(p.profiles?.name || 'Unknown')}<span class="dot">•</span>${timeAgo(p.created_at)}</div>
        <div class="card-sub" style="display:flex;gap:12px;margin-top:4px">
          <span>${isLiked ? ICONS.heart : ICONS.heartO} ${fmtNum(p.like_count)}</span>
          <span>${ICONS.comment} ${fmtNum(p.comment_count)}</span>
        </div>
      </div>
    </div>
  </div>`;
}

/* ---------- POST ---------- */
async function viewPost(id){
  if (!id) return viewHome();
  main().innerHTML = skeletonFeed(2);
  const { data: p, error } = await sb.from('posts').select(POST_SELECT).eq('id', id).maybeSingle();
  if (error || !p) { main().innerHTML = errorState(error || {message:'Post not found'}); return; }
  p.like_count = p.likes?.[0]?.count || 0; p.comment_count = p.comments?.[0]?.count || 0;

  const likedSet = await fetchMyLikes([p.id]);
  const liked = likedSet.has(p.id);
  const isNote = p.type === 'note';

  let media;
  if (p.type === 'video'){
    media = `<div class="player"><video controls playsinline preload="metadata" ${p.thumb_url ? `poster="${esc(p.thumb_url)}"` : ''} src="${esc(p.media_url)}"></video></div>`;
  } else if (p.type === 'image'){
    media = `<div class="player"><img src="${esc(p.media_url)}" alt="${esc(p.title)}"></div>`;
  } else {
    media = `<div class="note-card">
      <div style="font-size:12px;color:var(--text2);margin-bottom:10px">${ICONS.note} Note by ${esc(p.profiles?.name||'')}</div>
      <div class="note-body">${esc(p.content || p.description || '')}</div>
    </div>`;
  }

  main().innerHTML = `
  <div class="post-wrap">
    ${media}
    <h1 class="post-title">${esc(p.title)}</h1>
    ${p.description && !isNote ? `<div class="card-sub" style="margin-bottom:6px;white-space:pre-wrap">${esc(p.description)}</div>` : ''}
    <div class="post-stats">
      <a href="#/channel?id=${p.owner}" style="display:flex;align-items:center;gap:8px;color:var(--text);font-weight:600">
        ${avatarHTML(p.profiles, 26)} ${esc(p.profiles?.name || 'Unknown')}
      </a>
      <span class="dot">•</span> ${timeAgo(p.created_at)}
    </div>
    <div class="actionbar">
      <button class="act ${liked?'liked':''}" id="likeBtn">${liked?ICONS.heart:ICONS.heartO} <span id="likeCount">${fmtNum(p.like_count)}</span></button>
      <button class="act" id="commentBtn">${ICONS.comment} <span>${fmtNum(p.comment_count)}</span></button>
      <button class="act" id="shareBtn">${ICONS.share} Share</button>
    </div>
    <div class="comments">
      <h3 id="commentsTitle">Comments</h3>
      <div id="commentForm">${ me ? `
        <div class="cbox">
          ${avatarHTML(myProfile, 38)}
          <div class="cinput">
            <textarea id="commentText" placeholder="Add a comment…" rows="2"></textarea>
            <div style="text-align:right;margin-top:8px"><button class="btn sm" id="commentSubmit">Comment</button></div>
          </div>
        </div>` : `<p class="card-sub" style="margin-bottom:16px"><a href="#/auth" style="color:var(--accent);font-weight:600">Sign in</a> to join the conversation.</p>` }
      </div>
      <div id="commentList"></div>
    </div>
  </div>`;

  // like
  $('#likeBtn').onclick = async ()=>{
    if (!me) return toast('Sign in to like posts');
    const btn = $('#likeBtn');
    const nowLiked = !btn.classList.contains('liked');
    btn.classList.toggle('liked', nowLiked);
    $('#likeCount').textContent = fmtNum(p.like_count + (nowLiked ? 1 : -1));
    if (nowLiked){ const { error } = await sb.from('likes').insert({ post_id:p.id, user_id:me.id }); if (error){ btn.classList.remove('liked'); $('#likeCount').textContent = fmtNum(p.like_count); toast(error.message); } else p.like_count++; }
    else { const { error } = await sb.from('likes').delete().match({ post_id:p.id, user_id:me.id }); if (error){ btn.classList.add('liked'); $('#likeCount').textContent = fmtNum(p.like_count); } else p.like_count--; }
  };
  $('#commentBtn').onclick = ()=> document.querySelector('.comments').scrollIntoView({behavior:'smooth'});
  // share
  $('#shareBtn').onclick = async ()=>{
    const url = location.origin + location.pathname + '#/post?id=' + p.id;
    if (navigator.share){ try { await navigator.share({ title:p.title, url }); return; } catch(e){ if (e.name === 'AbortError') return; } }
    try { await navigator.clipboard.writeText(url); toast('Link copied — share it anywhere!'); }
    catch(e){ prompt('Copy this link:', url); }
  };
  // comments
  async function loadComments(){
    const { data: comments, error } = await sb.from('comments')
      .select('id,text,created_at,profiles!comments_user_id_fkey(id,handle,name,avatar_url)')
      .eq('post_id', p.id).order('created_at', { ascending:true });
    if (error) return toast(error.message);
    $('#commentsTitle').textContent = `Comments (${comments.length})`;
    $('#commentList').innerHTML = comments.length ? comments.map(c=>`
      <div class="comment">
        ${avatarHTML(c.profiles, 38)}
        <div class="cbody">
          <div class="chead"><b onclick="location.hash='#/channel?id=${c.profiles?.id||''}'">${esc(c.profiles?.name||'User')}</b> · @${esc(c.profiles?.handle||'')} · ${timeAgo(c.created_at)}</div>
          <div class="ctext">${esc(c.text)}</div>
        </div>
      </div>`).join('') : `<p class="card-sub">No comments yet. Start the conversation!</p>`;
  }
  const submit = document.getElementById('commentSubmit');
  if (submit) submit.onclick = async ()=>{
    const text = $('#commentText').value.trim();
    if (!text) return;
    submit.disabled = true;
    const { error } = await sb.from('comments').insert({ post_id:p.id, user_id:me.id, text });
    submit.disabled = false;
    if (error) return toast(error.message);
    $('#commentText').value = '';
    p.comment_count++;
    loadComments();
  };
  loadComments();
}

/* ---------- CHANNEL ---------- */
async function viewChannel(id){
  main().innerHTML = skeletonFeed(4);
  const { data: ch, error } = await sb.from('profiles').select('*').eq('id', id).maybeSingle();
  if (error || !ch) { main().innerHTML = errorState(error || {message:'Channel not found'}); return; }
  const [{ count: followers }, { count: postCount }] = await Promise.all([
    sb.from('follows').select('*', { count:'exact', head:true }).eq('channel_id', id),
    sb.from('posts').select('*', { count:'exact', head:true }).eq('owner', id),
  ]);
  let followed = false;
  if (me && me.id !== id){
    const { count } = await sb.from('follows').select('*', { count:'exact', head:true }).eq('channel_id', id).eq('follower_id', me.id);
    followed = count > 0;
  }
  const posts = await fetchPosts({ ownerId:id });

  const own = me && me.id === id;
  main().innerHTML = `
  <div class="channel-head">
    <div class="banner">${ch.banner_url ? `<img src="${esc(ch.banner_url)}" alt="">` : ''}</div>
    <div class="ch-row">
      ${avatarHTML(ch, 96)}
      <div class="ch-info">
        <h1>${esc(ch.name)}</h1>
        <div class="hnd">@${esc(ch.handle)} · ${fmtNum(followers||0)} followers · ${fmtNum(postCount||0)} posts</div>
        ${ch.bio ? `<div class="bio">${esc(ch.bio)}</div>` : ''}
      </div>
      <div class="ch-btns">
        ${own
          ? `<a class="btn ghost" href="#/settings">Customize channel</a>`
          : me ? `<button class="btn ${followed?'ghost':''}" id="followBtn">${followed ? 'Following ✓' : '+ Follow'}</button>`
               : `<a class="btn" href="#/auth">Follow</a>`}
      </div>
    </div>
  </div>
  ${posts.length
    ? `<div class="feed">${(await (async ()=>{ const liked = await fetchMyLikes(posts.map(p=>p.id)); return posts.map(p=>cardHTML(p, liked.has(p.id))).join(''); })())}</div>`
    : emptyState('No posts yet', own ? 'Upload your first video, note or image!' : 'This channel has not posted anything yet.')}

  ${own ? `<div style="margin-top:26px;text-align:center"><a class="btn" href="#/upload">+ New post</a></div>` : ''}`;

  const fb = document.getElementById('followBtn');
  if (fb) fb.onclick = async ()=>{
    const nowFollowed = fb.textContent.includes('+');
    fb.disabled = true;
    if (nowFollowed){
      const { error } = await sb.from('follows').insert({ channel_id:id, follower_id:me.id });
      if (!error){ fb.textContent = 'Following ✓'; fb.classList.add('ghost'); toast('Following ' + ch.name); }
      else toast(error.message);
    } else {
      const { error } = await sb.from('follows').delete().match({ channel_id:id, follower_id:me.id });
      if (!error){ fb.textContent = '+ Follow'; fb.classList.remove('ghost'); }
      else toast(error.message);
    }
    fb.disabled = false;
  };
}

/* ---------- SEARCH ---------- */
async function viewSearch(q){
  main().innerHTML = `<div class="page-title">Results for “${esc(q)}”</div>` + skeletonFeed(4);
  const like = `%${q.replace(/[%_,()]/g,'')}%`;
  const [postRes, chRes] = await Promise.all([
    fetchPosts({ search: q.replace(/[%_,]/g,'') }),
    sb.from('profiles').select('id,handle,name,avatar_url,bio').or(`name.ilike.${like},handle.ilike.${like}`).limit(10),
  ]);
  const channels = chRes.data || [];
  let html = `<div class="page-title">Results for “${esc(q)}”</div>`;
  if (channels.length){
    html += `<h3 style="font-size:15px;margin:4px 0 10px">Channels</h3>` + channels.map(c=>`
      <div class="result-ch" onclick="location.hash='#/channel?id=${c.id}'">
        ${avatarHTML(c, 56)}
        <div><b style="font-size:15px">${esc(c.name)}</b>
        <div class="card-sub">@${esc(c.handle)}${c.bio ? ' · ' + esc(c.bio.slice(0,80)) : ''}</div></div>
      </div>`).join('') + `<h3 style="font-size:15px;margin:20px 0 10px">Posts</h3>`;
  }
  if (postRes.length){
    const liked = await fetchMyLikes(postRes.map(p=>p.id));
    html += `<div class="feed">${postRes.map(p=>cardHTML(p, liked.has(p.id))).join('')}</div>`;
  } else {
    html += emptyState('No results', `Nothing matches “${esc(q)}”. Try different words.`);
  }
  main().innerHTML = html;
}
